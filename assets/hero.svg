<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0f1a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="200" rx="24" fill="url(#bg)"/>
  <rect x="40" y="40" width="720" height="120" rx="16" fill="none" stroke="#1e2a4a" stroke-width="1.5"/>
  <rect x="40" y="40" width="720" height="120" rx="16" fill="url(#glow)"/>

  <!-- avatar glyph -->
  <g transform="translate(70,70)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="30" cy="30" r="22" fill="#0b1020"/>
    <path d="M18 38c0-6.6 5.4-12 12-12s12 5.4 12 12" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="2.4" fill="#e2e8f0"/>
    <circle cx="36" cy="24" r="2.4" fill="#e2e8f0"/>
    <path d="M22 40q4 4 8 0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="130" y="78" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="800" fill="#f8fafc">
    Daniel Paul
  </text>
  <text x="130" y="104" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
    Full-Stack &amp; AI/ML Engineer
  </text>

  <!-- tagline -->
  <text x="130" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#64748b">
    Building production agentic workflows, on-device RAG &amp; high-throughput backends.
  </text>

  <!-- corner accent -->
  <path d="M690 60 L740 60 L740 110" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" filter="url(#soft)"/>
  <circle cx="740" cy="110" r="3" fill="#38bdf8" filter="url(#soft)"/>

  <text x="60" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#334155">
    Bengaluru, India • github.com/K1NGS1LVER
  </text>
</svg>